<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><link rel="icon" type="image/png" sizes="512x512" href="LengthConverterIcon.png"><link rel="apple-touch-icon" href="LengthConverterIcon.png"><title>智能尺寸转换</title><style>
:root{--bg:#0b1020;--card:rgba(255,255,255,.075);--line:rgba(255,255,255,.12);--text:#f6f8ff;--muted:#9da8c1;--p:#7567f5;--cyan:#52dcff;--ok:#52e6a6;--warn:#ffcf66}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:radial-gradient(circle at 12% 5%,#28225f 0,transparent 35%),radial-gradient(circle at 90% 75%,#104256 0,transparent 34%),var(--bg);padding:22px}.app{width:min(940px,100%);margin:auto}.head{padding:18px 2px}.brand{display:flex;align-items:center;gap:14px;margin-bottom:7px}.brand img{width:52px;height:52px;border-radius:13px;box-shadow:0 10px 28px #0006}.head h1{margin:0;font-size:clamp(27px,5vw,42px);letter-spacing:-.03em}.head p{margin:0 0 0 66px;color:var(--muted)}.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;backdrop-filter:blur(18px);box-shadow:0 25px 80px #0005}.ocrbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:17px}.btn,.upload{border:0;border-radius:12px;padding:11px 16px;background:linear-gradient(135deg,var(--p),#5546d5);color:white;font-weight:750;cursor:pointer;text-decoration:none;display:inline-block}.btn.secondary{background:#ffffff12;border:1px solid var(--line)}#file{display:none}.status{color:var(--muted);font-size:14px;flex:1;min-width:230px}.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}.dropzone{margin-bottom:16px;border:1.5px dashed #ffffff35;border-radius:15px;padding:17px;text-align:center;color:var(--muted);background:#ffffff08;cursor:pointer;transition:.2s}.dropzone b{color:#dce4ff}.dropzone:hover,.dropzone.active{border-color:var(--cyan);background:#52dcff12;color:#dff9ff;transform:translateY(-1px)}.grid{display:grid;gap:12px}.row{display:grid;grid-template-columns:58px minmax(100px,1fr) 145px 34px 145px minmax(120px,1fr);gap:10px;align-items:center;padding:13px;border:1px solid var(--line);background:#0509164f;border-radius:16px}.label{font-weight:800;text-align:center}.input,.out,select{width:100%;height:44px;border:1px solid var(--line);border-radius:11px;background:#ffffff0d;color:var(--text);padding:0 12px;font-size:16px;outline:none}.input:focus,select:focus{border-color:#8c82ff;box-shadow:0 0 0 3px #7567f533}select option{color:#111}.out{display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--cyan);cursor:pointer;overflow:auto}.arrow{text-align:center;color:var(--muted);font-size:19px}.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}.hint{font-size:13px;color:var(--muted)}.preview{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--line);grid-template-columns:180px 1fr;gap:16px}.preview.show{display:grid}.preview img{width:180px;max-height:145px;object-fit:contain;background:#fff;border-radius:13px}.result{font-size:14px;color:#cdd5ec;line-height:1.65;white-space:pre-wrap}.compare{margin-top:8px;padding:9px 11px;border-radius:10px;background:#ffffff0a}.drop{outline:2px dashed var(--cyan);outline-offset:5px}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:white;color:#151a2c;padding:10px 16px;border-radius:999px;font-weight:700;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:720px){body{padding:12px}.panel{padding:12px}.row{grid-template-columns:42px 1fr 112px}.arrow{display:none}.out{grid-column:2/3}.to{grid-column:3/4}.actions{align-items:stretch;flex-direction:column}.actions .btn{width:100%}.preview.show{grid-template-columns:1fr}.preview img{width:100%;max-height:220px}.status{min-width:100%}}
</style></head><body><main class="app"><header class="head"><div class="brand"><img src="LengthConverterIcon.png" alt=""><h1>智能尺寸转换</h1></div><p>长、宽、高同时转换 · 图片 OCR · 多单位自动对比</p></header><section class="panel" id="panel"><div class="ocrbar"><label class="upload" for="file">选择尺寸图片</label><input id="file" type="file" accept="image/*"><button class="btn secondary" id="paste">粘贴截图 Ctrl+V</button><button class="btn secondary" id="clear">清空全部</button><a class="btn" href="智能尺寸转换-Windows.zip" download>下载 Windows 桌面版</a><span class="status" id="status">支持 mm、cm、m、km、in、ft、yd，单位顺序不限</span></div><div class="dropzone" id="dropzone"><b>拖放尺寸图片到这里</b><br><small>也可以点击这里选择图片</small></div><div class="grid" id="rows"></div><div class="actions"><span class="hint">填几行就转换几行；点击结果可单独复制</span><button class="btn" id="copy">复制已填写结果</button></div><div class="preview" id="preview"><img id="img" alt="尺寸图预览"><div><b>识别与校验</b><div class="result" id="ocrResult"></div></div></div></section></main><div class="toast" id="toast">已复制</div><script src="assets/tesseract.min.js"></script><script>
const units={mm:{n:'毫米 mm',m:.001},cm:{n:'厘米 cm',m:.01},m:{n:'米 m',m:1},km:{n:'千米 km',m:1000},in:{n:'英寸 in',m:.0254},ft:{n:'英尺 ft',m:.3048},yd:{n:'码 yd',m:.9144}}, labels=['长','宽','高'];
const rows=document.querySelector('#rows');function opts(v){return Object.entries(units).map(([k,x])=>`<option value="${k}" ${k===v?'selected':''}>${x.n}</option>`).join('')}for(let i=0;i<3;i++)rows.insertAdjacentHTML('beforeend',`<div class="row"><div class="label">${labels[i]}</div><input class="input" inputmode="decimal" placeholder="输入数值"><select class="from">${opts('cm')}</select><div class="arrow">→</div><select class="to">${opts('in')}</select><div class="out" title="点击复制"></div></div>`);
function fmt(n){if(!Number.isFinite(n))return'';return Number(n.toPrecision(12)).toString()}function convert(r){const v=Number(r.querySelector('.input').value.trim().replace(',','.')),a=r.querySelector('.from').value,b=r.querySelector('.to').value;r.querySelector('.out').textContent=Number.isFinite(v)?fmt(v*units[a].m/units[b].m):''}document.querySelectorAll('.row').forEach(r=>{r.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',()=>convert(r)));r.querySelector('.out').onclick=()=>copy(r.querySelector('.out').textContent)});
function copy(t){if(!t)return;navigator.clipboard.writeText(t);const x=document.querySelector('#toast');x.classList.add('show');clearTimeout(x.t);x.t=setTimeout(()=>x.classList.remove('show'),1200)}document.querySelector('#copy').onclick=()=>copy([...document.querySelectorAll('.row')].map((r,i)=>r.querySelector('.out').textContent?`${labels[i]}：${r.querySelector('.out').textContent} ${r.querySelector('.to').value}`:'').filter(Boolean).join(' × '));
const aliases={mm:/^(mm|millimeter|millimeters|millimetre|millimetres)$/i,cm:/^(cm|centimeter|centimeters|centimetre|centimetres)$/i,km:/^(km|kilometer|kilometers|kilometre|kilometres)$/i,m:/^(m|meter|meters|metre|metres)$/i,in:/^(in|inch|inches)$/i,ft:/^(ft|foot|feet)$/i,yd:/^(yd|yard|yards)$/i};function norm(s){return Object.keys(aliases).find(k=>aliases[k].test(s))||null}
async function compactCanvas(file){const img=await createImageBitmap(file),c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});c.width=img.width;c.height=img.height;x.drawImage(img,0,0);const d=x.getImageData(0,0,c.width,c.height).data,inkCol=[];for(let xx=0;xx<c.width;xx++){let n=0;for(let y=0;y<c.height;y++){const i=(y*c.width+xx)*4;if(d[i]<190&&d[i+1]<190&&d[i+2]<190&&d[i+3]>20)n++}inkCol.push(n)}let first=inkCol.findIndex(n=>n>0),last=inkCol.length-1-[...inkCol].reverse().findIndex(n=>n>0);if(first<0)return null;const gaps=[];for(let i=first;i<=last;){if(inkCol[i]){i++;continue}let a=i;while(i<=last&&!inkCol[i])i++;gaps.push({a,b:i-1,w:i-a})}const best=gaps.filter(g=>g.w>=2).sort((a,b)=>b.w-a.w).slice(0,2).sort((a,b)=>a.a-b.a);if(best.length<2)return null;const cuts=[[first,best[0].a-1],[best[0].b+1,best[1].a-1],[best[1].b+1,last]],scale=5,pad=45,out=document.createElement('canvas'),o=out.getContext('2d');out.width=cuts.reduce((s,q)=>s+(q[1]-q[0]+1)*scale,0)+pad*4;out.height=c.height*scale+pad*2;o.fillStyle='#fff';o.fillRect(0,0,out.width,out.height);o.imageSmoothingEnabled=false;let dx=pad;for(const q of cuts){const w=q[1]-q[0]+1;o.drawImage(c,q[0],0,w,c.height,dx,pad,w*scale,c.height*scale);dx+=w*scale+pad}return out}function parse(text){const num='(-?\\d+(?:[\\.,]\\d+)?)',unit='(millimeters?|millimetres?|mm|centimeters?|centimetres?|cm|kilometers?|kilometres?|km|meters?|metres?|m|inches|inch|in|feet|foot|ft|yards?|yd)',rx=new RegExp('\\bL(?:ENGTH)?\\s*[:=]?\\s*'+num+'\\s*[,;/|xX×-]*\\s*W(?:IDTH)?\\s*[:=]?\\s*'+num+'\\s*[,;/|xX×-]*\\s*H(?:EIGHT)?\\s*[:=]?\\s*'+num+'\\s*'+unit+'\\b','gi');return [...text.replace(/[\r\n]+/g,' ').matchAll(rx)].map(m=>({v:[m[1],m[2],m[3]].map(x=>+x.replace(',','.')),u:norm(m[4]),raw:m[0]})).filter(x=>x.u)}function fallbackNumbers(text){return [...text.matchAll(/-?\d+(?:[\.,]\d+)?/g)].map(m=>+m[0].replace(',','.')).filter(Number.isFinite).slice(0,3)}function err(a,b){return a.v.reduce((s,x,i)=>s+Math.abs(x*units[a.u].m-b.v[i]*units[b.u].m)/Math.max(Math.abs(x*units[a.u].m),Math.abs(b.v[i]*units[b.u].m),1e-9),0)/3}
async function recognize(file){const status=document.querySelector('#status'),result=document.querySelector('#ocrResult'),preview=document.querySelector('#preview'),img=document.querySelector('#img');status.className='status';status.textContent='正在加载离线模型并识别…';preview.classList.add('show');img.src=URL.createObjectURL(file);result.textContent='OCR 处理中，首次加载约 10–20 秒。';try{const worker=await Tesseract.createWorker('eng',Tesseract.OEM.LSTM_ONLY,{workerPath:'./assets/worker.min.js',corePath:'./assets/tesseract-core-lstm.wasm.js',langPath:'./',logger:m=>{if(m.progress)status.textContent=`识别中 ${Math.round(m.progress*100)}% · ${m.status}`}});let {data:{text}}=await worker.recognize(file);let sets=parse(text),rs=[...document.querySelectorAll('.row')];if(!sets.length){let nums=fallbackNumbers(text);if(nums.length<3){const compact=await compactCanvas(file);if(compact){await worker.setParameters({tessedit_pageseg_mode:'7',preserve_interword_spaces:'1'});const retry=await worker.recognize(compact);text=retry.data.text;nums=fallbackNumbers(text)}}await worker.terminate();if(nums.length<3){status.className='status warn';status.textContent='未识别到至少 3 个尺寸数字，请换清晰图片或手动填写';result.textContent='原始 OCR：\n'+text;return}rs.forEach((r,i)=>{r.querySelector('.input').value=nums[i];convert(r)});status.className='status warn';status.textContent='未识别到单位，已按图片顺序填入长、宽、高，请确认当前单位';result.textContent=`无单位回退：${nums.join(' × ')}\n按 OCR 从左到右 / 从上到下的顺序填入。\n\n原始 OCR：\n${text}`;return}await worker.terminate();const a=sets[0];rs.forEach((r,i)=>{r.querySelector('.input').value=a.v[i];r.querySelector('.from').value=a.u;convert(r)});let msg=`采用：${a.v.join(' × ')} ${a.u}`;if(sets.length>1){let b=sets.slice(1).sort((x,y)=>err(a,x)-err(a,y))[0],e=err(a,b);rs.forEach((r,i)=>{r.querySelector('.to').value=b.u;convert(r)});msg+=`\n对比：${b.v.join(' × ')} ${b.u}\n换算平均误差：${(e*100).toFixed(2)}%`;status.className='status '+(e<.06?'ok':'warn');status.textContent=e<.06?'识别成功，两组单位换算一致':'识别成功，但两组数值差异较大，请人工核对'}else{status.className='status ok';status.textContent=`识别成功，单位：${a.u}`}result.textContent=msg+'\n\n原始 OCR：\n'+text}catch(e){status.className='status warn';status.textContent='图片识别失败';result.textContent=e.message||String(e)}}
const file=document.querySelector('#file'),dropzone=document.querySelector('#dropzone');file.onchange=()=>file.files[0]&&recognize(file.files[0]);dropzone.onclick=()=>file.click();document.querySelector('#clear').onclick=()=>{document.querySelectorAll('.input').forEach(x=>x.value='');document.querySelectorAll('.out').forEach(x=>x.textContent='');file.value='';const img=document.querySelector('#img');if(img.src.startsWith('blob:'))URL.revokeObjectURL(img.src);img.removeAttribute('src');document.querySelector('#preview').classList.remove('show');document.querySelector('#ocrResult').textContent='';const s=document.querySelector('#status');s.className='status';s.textContent='已清空，可重新输入或识别图片'};document.querySelector('#paste').onclick=async()=>{try{const items=await navigator.clipboard.read();for(const i of items)for(const t of i.types)if(t.startsWith('image/'))return recognize(await i.getType(t));document.querySelector('#status').textContent='剪贴板中没有图片'}catch(e){document.querySelector('#status').textContent='浏览器未允许读取剪贴板，请使用“选择尺寸图片”'}};addEventListener('paste',e=>{const f=[...e.clipboardData.files].find(x=>x.type.startsWith('image/'));if(f)recognize(f)});const panel=document.querySelector('#panel');['dragenter','dragover'].forEach(x=>panel.addEventListener(x,e=>{e.preventDefault();dropzone.classList.add('active')}));['dragleave','drop'].forEach(x=>panel.addEventListener(x,e=>{e.preventDefault();dropzone.classList.remove('active')}));panel.addEventListener('drop',e=>{const f=[...e.dataTransfer.files].find(x=>x.type.startsWith('image/'));if(f)recognize(f);else{const s=document.querySelector('#status');s.className='status warn';s.textContent='请拖入 PNG、JPG、WEBP 等图片文件'}});
</script></body></html>
