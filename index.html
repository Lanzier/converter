async function recognize(file){const status=document.querySelector('#status'),result=document.querySelector('#ocrResult'),preview=document.querySelector('#preview'),img=document.querySelector('#img');status.className='status';status.textContent='正在加载离线模型并识别…';preview.classList.add('show');img.src=URL.createObjectURL(file);result.textContent='OCR 处理中，首次加载约 10–20 秒。';try{const worker=await Tesseract.createWorker('eng',Tesseract.OEM.LSTM_ONLY,{workerPath:'./assets/worker.min.js',corePath:'./assets/tesseract-core-lstm.wasm.js',langPath:'./',logger:m=>{if(m.progress)status.textContent=`识别中 ${Math.round(m.progress*100)}% · ${m.status}`}});let {data:{text}}=await worker.recognize(file);await worker.terminate();let dims=parse(text),weights=parseWeight(text),rs=[...document.querySelectorAll('.row')],notes=[];if(dims.length){const a=dims[0];for(let i=0;i<3;i++){rs[i].querySelector('.input').value=a.v[i];rs[i].querySelector('.from').value=a.u;convert(rs[i])}notes.push(`尺寸：${a.v.join(' × ')} ${a.u}`);if(dims.length>1){const b=dims.slice(1).sort((x,y)=>err(a,x)-err(a,y))[0];for(let i=0;i<3;i++){rs[i].querySelector('.to').value=b.u;convert(rs[i])}}}if(weights.length){const w=weights[0],r=rs[3];r.querySelector('.input').value=w.v;r.querySelector('.from').value=w.u;convert(r);notes.push(`重量：${w.v} ${w.u}`)}if(!dims.length&&!weights.length){let nums=fallbackNumbers(text);if(nums.length===1&&!/[\.,]/.test(text)){const split=await layoutGroups(file,3);if(split){const stream=(text.match(/\d/g)||[]).join(''),tokens=[];let pos=0;for(const q of split){let v=stream.slice(pos,pos+q.digitCount);if(q.decimalAt>=0&&q.decimalAt<v.length)v=v.slice(0,q.decimalAt)+'.'+v.slice(q.decimalAt);tokens.push(v);pos+=q.digitCount}if(pos===stream.length)nums=fallbackNumbers(tokens.join(' '))}}if(nums.length>=3){const parts=await layoutGroups(file,3);if(parts){const stream=(text.match(/\d/g)||[]).join(''),recognized=[],lineCounts=text.split(/[\r\n]+/).map(s=>(s.match(/\d/g)||[]).length).filter(Boolean);let pos=0,pi=0;for(const part of parts){let count=lineCounts.length===3?lineCounts[pi++]:part.digitCount,correct=stream.slice(pos,pos+count);if(part.decimalAt>=0&&part.decimalAt<correct.length)correct=correct.slice(0,part.decimalAt)+'.'+correct.slice(part.decimalAt);recognized.push(correct);pos+=count}if(pos===stream.length)nums=fallbackNumbers(recognized.join(' '))}for(let i=0;i<3;i++){rs[i].querySelector('.input').value=nums[i];convert(rs[i])}notes.push(`无单位尺寸回退：${nums.slice(0,3).join(' × ')}`);status.className='status warn';status.textContent='未识别到单位，已填入长、宽、高，请确认长度单位'}else if(nums.length===1){const parts=await layoutGroups(file,1);let value=nums[0];if(parts&&parts[0].decimalAt>=0){const stream=(text.match(/\d/g)||[]).join(''),q=parts[0];value=+(stream.slice(0,q.decimalAt)+'.'+stream.slice(q.decimalAt))}rs[3].querySelector('.input').value=value;convert(rs[3]);notes.push(`无单位重量回退：${value}`);status.className='status warn';status.textContent='未识别到单位，已填入重量，请确认重量单位'}else{status.className='status warn';status.textContent='未识别到可用的尺寸或重量，请换清晰图片或手动填写';result.textContent='原始 OCR：\n'+text;return}}else{status.className='status ok';status.textContent=dims.length&&weights.length?'尺寸和重量均识别成功':dims.length?'尺寸识别成功':'重量识别成功'}result.textContent=notes.join('\n')+'\n\n原始 OCR：\n'+text}catch(e){status.className='status warn';status.textContent='图片识别失败';result.textContent=e.message||String(e)}}
const file=document.querySelector('#file'),dropzone=document.querySelector('#dropzone');file.onchange=()=>file.files[0]&&recognize(file.files[0]);dropzone.onclick=()=>file.click();document.querySelector('#clear').onclick=()=>{document.querySelectorAll('.input').forEach(x=>x.value='');document.querySelectorAll('.out').forEach(x=>x.textContent='');file.value='';const img=document.querySelector('#img');if(img.src.startsWith('blob:'))URL.revokeObjectURL(img.src);img.removeAttribute('src');document.querySelector('#preview').classList.remove('show');document.querySelector('#ocrResult').textContent='';const s=document.querySelector('#status');s.className='status';s.textContent='已清空，可重新输入或识别图片'};document.querySelector('#paste').onclick=async()=>{try{const items=await navigator.clipboard.read();for(const i of items)for(const t of i.types)if(t.startsWith('image/'))return recognize(await i.getType(t));document.querySelector('#status').textContent='剪贴板中没有图片'}catch(e){document.querySelector('#status').textContent='浏览器未允许读取剪贴板，请使用“选择尺寸图片”'}};addEventListener('paste',e=>{const f=[...e.clipboardData.files].find(x=>x.type.startsWith('image/'));if(f)recognize(f)});const panel=document.querySelector('#panel');['dragenter','dragover'].forEach(x=>panel.addEventListener(x,e=>{e.preventDefault();dropzone.classList.add('active')}));['dragleave','drop'].forEach(x=>panel.addEventListener(x,e=>{e.preventDefault();dropzone.classList.remove('active')}));panel.addEventListener('drop',e=>{const f=[...e.dataTransfer.files].find(x=>x.type.startsWith('image/'));if(f)recognize(f);else{const s=document.querySelector('#status');s.className='status warn';s.textContent='请拖入 PNG、JPG、WEBP 等图片文件'}});
</script></body></html>
